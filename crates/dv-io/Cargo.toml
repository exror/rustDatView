[package]
name = "dv-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File readers/writers of datview (Rust port of pyDatView's weio-based io package)"

[dependencies]
dv-core.workspace = true
thiserror.workspace = true
regex.workspace = true
dv-tools.workspace = true
nalgebra = "0.33"
csv = "1.3"
calamine = { version = "0.31", features = ["dates"] }
parquet = { version = "56", features = ["arrow"] }
arrow-array = "56"
arrow-schema = "56"
netcdf3 = "0.6.1"
vtkio = "0.6.3"
chrono.workspace = true
flate2 = "1"
serde_json.workspace = true
hdf5-reader = "0.9.1"
